name: smoke

# The paper's numbers need the 1.6 GB dataset, so CI cannot check them; the
# README says how to check them yourself. This checks that the code still runs
# end to end on the synthetic stand-in the audit uses when the data is absent,
# and that the two safety stops still refuse: no figure from synthetic numbers,
# and no pipeline run without the data.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned analysis packages (torch is only needed to extract features)
        run: python -m pip install numpy==2.4.6 pandas==3.0.5 scipy==1.17.1 scikit-learn==1.9.1 matplotlib==3.11.2
      - name: Every script compiles
        run: python -m compileall -q src run_all.py
      - name: The audit runs on the synthetic stand-in and labels it
        run: |
          python src/calibration_audit.py | tee audit.txt
          grep -q "SYNTHETIC" audit.txt
          python -c "import json; assert json.load(open('out/calibration_audit_result.json'))['mode'] == 'SYNTHETIC'"
      - name: No figure is drawn from synthetic numbers
        run: |
          if python src/make_figures.py; then echo "make_figures accepted synthetic data"; exit 1; fi
      - name: The pipeline stops when the data is missing
        run: |
          if python run_all.py; then echo "run_all ran without the data"; exit 1; fi
